  reference: "Exodus 34:5-7"
  text: |
    Then the Lord came down in the cloud and stood there with him<br>
    and proclaimed his name, the Lord. And he passed in front of Moses, proclaiming,<br><br>
    “The Lord, the Lord, the compassionate and gracious God,<br>
    slow to anger, abounding in love and faithfulness,<br>
    maintaining love to thousands, and forgiving wickedness, rebellion and sin.<br>
    Yet he does not leave the guilty unpunished;<br>
    he punishes the children and their children for the sin of the parents<br>
    to the third and fourth generation.”

