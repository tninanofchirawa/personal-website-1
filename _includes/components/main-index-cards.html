<!-- Main Index Directory Navigation -->
<div class="container my-5">
  <div class="text-center mb-5">
    <h2 class="fw-bold text-uppercase tracking-wide">Main Index</h2>
    <p class="text-muted">Tap any card to reach its section.</p>
    <hr class="mx-auto border-secondary" style="width: 60px; border-width: 3px;">
  </div>

  <div class="row g-4">
    {% for card in site.data.index_cards.cards %}
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card h-100 shadow-sm border-0 rounded-3 bg-white position-relative card-hover-effect">
        <div class="card-body p-4 d-flex flex-column">
          <div class="mb-3 {{ card.icon_class }} fs-3">{{ card.icon }}</div>
          <h3 class="h5 card-title fw-bold">{{ card.title }}</h3>
          <p class="card-text text-muted flex-grow-1">
            {{ card.text }}
          </p>
          <a
            href="{{ card.url | relative_url }}"
            class="stretched-link text-decoration-none {{ card.link_class }} fw-bold mt-3"
          >
            {{ card.link_text }}
          </a>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
