<!-- Monthly Promise Verse Container -->
<div class="row g-4 justify-content-center mb-5">
  <div class="col-12 col-xl-10">
    <div class="p-4 p-md-5 bg-white rounded shadow-sm border">
      <h2 class="mb-3 border-bottom pb-2">Promise Verse for {{ site.data.promise_verse.current.month }}</h2>

      <blockquote class="special-garamond text-muted fw-bold mb-0">
        <p class="mb-3">
          {{ site.data.promise_verse.current.text }}
        </p>
        <footer class="text-secondary fw-normal">
          — {{ site.data.promise_verse.current.reference }}
        </footer>
      </blockquote>
    </div>
  </div>
</div>
