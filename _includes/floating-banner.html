<!-- Floating Google Form Banner Component -->
<div id="top-banner-container" class="top-banner" role="region" aria-label="Data collection notification">
  <div id="banner-touch-area" class="banner-content" role="button" tabindex="0" title="Click to fill out the Google Form">
    <span class="banner-badge">GForm</span>
    <span class="banner-text">
      <strong>Form Link:</strong> Tap here to Fill the Data Collection Form!
    </span>
  </div>
  <button id="close-banner-btn" class="banner-close-btn" aria-label="Dismiss banner">&times;</button>
</div>
