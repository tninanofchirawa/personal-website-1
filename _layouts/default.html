<!DOCTYPE html>
<html lang="en">

<head>
  {% include head.html %}
  <style>
    /* THE RESPONSIVE HERO ENGINE */
    .hero-banner {
      height: 65vh;
      /* Slightly taller (65% viewport height) to let images breathe */

      /* Dynamic background targeting using Jekyll variables */
      background-image: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
      url('{{ page.hero_image | relative_url }}');

      /* Absolute mobile and desktop positioning layout rules */
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      color: #ffffff;
      transition: all 0.3s ease-in-out;
    }

    .hero-banner h1 {
      font-size: 4.5rem;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
      /* Adds a shadow so text reads easily over the huge image */
    }

    .hero-banner p {
      font-size: 1.5rem;
    }

    /* Shrink padding and text size smoothly when viewed on mobile screens */
    /* Look for this block in your _layouts/default.html */
    @media (max-width: 768px) {
      .hero-banner {
        /* HANDS-ON EDIT: Force the hero image to take up 80% of the phone screen */
        height: 80vh !important;
      }

      .hero-banner h1 {
        font-size: 3.375rem !important;
        /* Make the title slightly bigger on mobile so it pops */
        text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
        /* Adds a shadow so text reads easily over the huge image */
      }

      .hero-banner p {
        font-size: 1.1rem !important;
        display: block !important;
        /* Forces your subtitle to show up on mobile for that inviting look */
      }
    }
  </style>
</head>

<body>
  {% include navbar.html %}
  <div class="hero-banner d-flex justify-content-center align-items-center text-center px-3 shadow-sm">
    <div class="container">
      <h1 class="display-5 fw-bold text-uppercase tracking-wide animate__animated animate__fadeInDown">
        {% if page.hero_title %}{{ page.hero_title }}{% else %}{{ page.title }}{% endif %}
      </h1>
      {% if page.hero_subtitle %}
      <p class="lead mb-0 text-light opacity-75 font-monospace d-none d-md-block">{{ page.hero_subtitle }}</p>
      {% endif %}
    </div>
  </div>

  <main class="container-fluid py-4 px-3 px-md-5">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" async></script>
</body>

</html>
